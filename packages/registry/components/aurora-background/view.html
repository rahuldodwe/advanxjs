<div class="aurora-background">
  <div class="aurora-orbs" aria-hidden="true">
    <span class="aurora-orb aurora-orb-1"></span>
    <span class="aurora-orb aurora-orb-2"></span>
    <span class="aurora-orb aurora-orb-3"></span>
  </div>
  <!-- AdvanxJS has no slot system: swap the markup inside .aurora-content
       for your own. The orb layer above is what makes this a wrapper. -->
  <div class="aurora-content">
    <h2 class="aurora-title">{{ title }}</h2>
    <p class="aurora-subtitle">{{ subtitle }}</p>
  </div>
</div>
