<article class="spotlight-card" ax-on:mousemove="onMouseMove" ax-on:mouseleave="onMouseLeave">
  <div class="spotlight-card-glow" aria-hidden="true" :style="spotlightStyle"></div>
  <div class="spotlight-card-body">
    <p class="spotlight-card-eyebrow">{{ eyebrow }}</p>
    <h3 class="spotlight-card-title">{{ title }}</h3>
    <p class="spotlight-card-desc">{{ description }}</p>
  </div>
</article>
