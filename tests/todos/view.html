<div class="card">
  <h1>AdvanxJS Todo List</h1>
  <ul>
    <li ax-for="todo in todos">
      {{ todo.text }}
      <button ax-on:click="removeTask(todo.id)">x</button>
      <button ax-on:click="setLabel(todo.id, 'done')">done</button>
    </li>
  </ul>
  <button ax-on:click="addTodo">Add Task</button>
</div>
